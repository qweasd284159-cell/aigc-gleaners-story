<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGC 作品集：《拾穗》名畫故事</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      max-width: 680px;
      width: 100%;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #f59e0b; margin-top: 0; font-size: 1.4rem; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .badge {
      background: #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
      margin-bottom: 20px;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    p { line-height: 1.6; color: #cbd5e1; font-size: 0.95rem; }
    ul { color: #cbd5e1; font-size: 0.9rem; padding-left: 20px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌾 AIGC 數位敘事：《拾穗》名畫故事</h2>
    <div class="tags">
      <span class="badge">Google Veo</span>
      <span class="badge">即夢 AI</span>
      <span class="badge">FlexClip</span>
      <span class="badge">AI 語音合成</span>
    </div>
    
    <div class="video-container">
      <iframe src="https://drive.google.com/file/d/1M2hFBcGcFM8-XKMZc1ge1mjr9flRJbdL/preview" allow="autoplay"></iframe>
    </div>

    <p><b>專案簡介：</b>本專案為生成式 AI 多模態創作實作，將十九世紀米勒的經典寫實名畫《拾穗》結合聖經《路德記》歷史典故，透過動態生成、圖像延伸與影音剪輯打造完整的歷史敘事短片。</p>
    
    <p><b>AIGC 工作流說明：</b></p>
    <ul>
      <li><b>人物動態生成</b>：使用 Google Veo 賦予油畫人物細膩動作與麥浪微風。</li>
      <li><b>歷史場景延伸</b>：利用即夢 AI 還原伯利恆麥田與人物互動畫面。</li>
      <li><b>影音整合後製</b>：採用 FlexClip 進行 AI 旁白配音、智慧字幕生成與轉場剪輯。</li>
    </ul>
  </div>
</body>
</html>
